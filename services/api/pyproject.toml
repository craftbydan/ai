[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwai"
version = "0.1.0"
description = "handwriting-ai API"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2",
  "alembic",
  "pydantic-settings",
  "python-multipart",
  "Pillow",
  "numpy",
  "opencv-python-headless",
  "pypdfium2",
  "reportlab",
  "pikepdf",
  "anthropic",
  "argon2-cffi",
  "stripe",
  "itsdangerous",
  "email-validator",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pip-audit", "httpx", "ruff", "mypy"]
ml = [
  "torch",
  "torchvision",
  "transformers",
  "diffusers",
  "easydict",
  "einops",
  "lmdb",
  "pyyaml",
  "six",
  "packaging",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hwai.render" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs an NVIDIA GPU and One-DM weights (set RUN_GPU_TESTS=1)"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = [
  "cv2.*", "pypdfium2.*", "pikepdf.*", "reportlab.*",
  "torch.*", "transformers.*", "diffusers.*", "data_loader.*", "models.*", "parse_config.*",
]
ignore_missing_imports = true
