[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwai"
version = "0.1.0"
description = "handwriting-ai API"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2",
  "alembic",
  "pydantic-settings",
  "python-multipart",
  "Pillow",
  "numpy",
  "opencv-python-headless",
  "pypdfium2",
  "reportlab",
  "pikepdf",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy"]
ml = ["torch", "transformers"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["cv2.*", "pypdfium2.*", "pikepdf.*", "reportlab.*"]
ignore_missing_imports = true
